<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Mon Florian, itinéraire de voyage personnalisé</title>
  <desc id="description">Carte de partage Mon Florian avec le personnage de la marque et la promesse de préparer un itinéraire à partir des envies du voyageur.</desc>
  <rect width="1200" height="630" fill="#f4f7ff"/>
  <circle cx="1110" cy="118" r="168" fill="#dfff55"/>
  <path d="M856 630C838 505 857 370 952 300c92-67 191-37 248 5v325Z" fill="#1772ff"/>
  <path d="M1002 630c-12-91 3-190 75-239 46-31 91-32 123-18v257Z" fill="#061a3b" opacity=".13"/>
  <image href="monflorian-wordmark.png" x="72" y="44" width="226" height="121" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(74 190)">
    <rect width="330" height="42" rx="21" fill="#fffefb" stroke="rgba(6,26,59,.14)"/>
    <circle cx="23" cy="21" r="7" fill="#dfff55" stroke="#061a3b" stroke-width="2"/>
    <text x="43" y="27" fill="#0b4fd8" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15" font-weight="700">ITINÉRAIRE PERSONNALISÉ</text>
  </g>
  <text x="72" y="306" fill="#061a3b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Raconte-moi ton envie.</text>
  <text x="72" y="374" fill="#061a3b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">Je prépare ton itinéraire.</text>
  <path d="M72 409c176 5 391 1 633-7" fill="none" stroke="#1772ff" stroke-width="5" stroke-linecap="round"/>
  <text x="72" y="472" fill="#17345f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="500">Une proposition privée à relire</text>
  <text x="72" y="506" fill="#17345f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="24" font-weight="500">avant toute réservation.</text>
  <g transform="translate(72 555)">
    <circle cx="7" cy="7" r="7" fill="#dfff55"/>
    <text x="27" y="13" fill="#061a3b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="17" font-weight="700">Accès gratuit sur invitation</text>
  </g>
  <image href="florian-v2-original.png" x="828" y="84" width="350" height="350" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(803 419) rotate(-2)">
    <rect width="310" height="128" rx="22" fill="#fffefb" stroke="#061a3b" stroke-opacity=".14"/>
    <text x="24" y="40" fill="#061a3b" font-family="Avenir Next, Segoe UI, sans-serif" font-size="17" font-weight="700">Le point de Florian</text>
    <text x="24" y="72" fill="#17345f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">Garde du temps libre entre</text>
    <text x="24" y="96" fill="#17345f" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">deux changements de ville.</text>
  </g>
</svg>

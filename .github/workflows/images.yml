name: Container images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "assets/brand/monflorian-logo.png"
      - "deployment/vps/**"
      - "scripts/*vps*"
      - "scripts/*application-release*"
      - "scripts/lib/release_contract.py"
      - "scripts/lib/vps_image_resolver.py"
      - "tests/test_vps_*.py"
      - ".dockerignore"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/images.yml"
      - ".github/workflows/vps-integration.yml"

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/backend
  TRIVY_VERSION: v0.72.0

jobs:
  validate:
    name: Build, exercise and scan backend
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the linux/amd64 candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          pull: true
          tags: monflorian-ci/backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha,scope=monflorian-backend-production
          cache-to: type=gha,mode=max,scope=monflorian-backend-production

      - name: Exercise the no-cost health boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          container="monflorian-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm --force "${container}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          test "$(docker image inspect --format '{{.Config.User}}' "monflorian-ci/backend:${GITHUB_SHA}")" = "10001:10001"
          docker run --detach \
            --name "${container}" \
            --publish 127.0.0.1:18080:8080 \
            --env MONFLORIAN_GENERATION_ENABLED=false \
            --env MONFLORIAN_PUBLIC_ORIGIN=http://127.0.0.1:18080 \
            --env MONFLORIAN_RELEASE="${GITHUB_SHA}" \
            "monflorian-ci/backend:${GITHUB_SHA}" >/dev/null
          for _attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/health \
              --output "${RUNNER_TEMP}/health.json"; then
              break
            fi
            sleep 1
          done
          HEALTH="${RUNNER_TEMP}/health.json" python3 -c '
          import json, os
          with open(os.environ["HEALTH"], encoding="utf-8") as source:
              value = json.load(source)
          assert value == {
              "status": "ok",
              "release": os.environ["GITHUB_SHA"],
              "generationReady": False,
          }, value
          '

      - name: Scan fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: monflorian-ci/backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish immutable backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push one immutable linux/amd64 image with SBOM and provenance
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=monflorian-backend-production
          cache-to: type=gha,mode=max,scope=monflorian-backend-production

      - name: Scan the exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Attest the exact published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify the GitHub provenance policy
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify "oci://${IMAGE_REPOSITORY}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/images.yml" \
            --deny-self-hosted-runners

      - name: Report the immutable image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '### Published backend image'
            echo
            echo "Source revision: \`${GITHUB_SHA}\`"
            echo "Image: \`${IMAGE_REPOSITORY}@${DIGEST}\`"
          } >>"${GITHUB_STEP_SUMMARY}"

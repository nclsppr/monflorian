name: Native iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build and test native iOS
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check generated native resources
        run: npm run ios:check
      - name: Build for iOS Simulator
        run: ./scripts/ios-build.sh
      - name: Verify native photos against the shared API
        run: ./scripts/ios-photo-contract.sh
      - name: Run native tests
        run: ./scripts/ios-test.sh
      - name: Keep native test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ios-validation
          path: |
            build/ios/*.xcresult
            build/ios/*.log
          retention-days: 7
          if-no-files-found: ignore

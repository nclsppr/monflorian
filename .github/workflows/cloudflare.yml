name: Cloudflare release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Cloudflare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse a checkout different from the event revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate the Worker bundle
        run: npm run check:worker

      - name: Refuse stale generated bindings
        run: git diff --exit-code -- worker-configuration.d.ts

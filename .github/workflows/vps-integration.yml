name: VPS integration release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vps-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APPLICATION_RELEASE_ARTIFACT_TYPE: application/vnd.vps-infra.application-release.v1
  APPLICATION_RELEASE_LAYER_MEDIA_TYPE: application/vnd.vps-infra.application-release.v1+json
  APPLICATION_RELEASE_REPOSITORY: ghcr.io/${{ github.repository }}/application-release
  ORAS_IMAGE: ghcr.io/oras-project/oras:v1.3.0@sha256:6ce045ce069a89934d6666b8b49f9c4c0145201bd6de6dbe2aee267814c55468
  SOURCE_URL: https://github.com/${{ github.repository }}
  VPS_ARCHIVE_MEDIA_TYPE: application/vnd.vps-infra.application-integration.v1+tar+gzip
  VPS_ARTIFACT_TYPE: application/vnd.vps-infra.application-integration.v1
  VPS_INTEGRATION_REPOSITORY: ghcr.io/${{ github.repository }}/vps-integration
  VPS_INVENTORY_MEDIA_TYPE: application/vnd.vps-infra.application-integration.inventory.v1+json

jobs:
  validate:
    name: Validate application release
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run the producer contract tests
        run: ./scripts/verify-vps-release-contract

      - name: Build and verify both deterministic contracts twice
        shell: bash
        run: |
          set -Eeuo pipefail
          images="${RUNNER_TEMP}/component-images.json"
          IMAGES="${images}" python3 -c '
          import json, os
          value = {
              "backend": "ghcr.io/nclsppr/monflorian/backend@sha256:" + "a" * 64,
          }
          with open(os.environ["IMAGES"], "w", encoding="ascii") as output:
              json.dump(value, output, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          '
          for build in first second; do
            directory="${RUNNER_TEMP}/${build}"
            ./scripts/build-vps-integration \
              --revision "${GITHUB_SHA}" \
              --component-images "${images}" \
              --output-directory "${directory}"
            ./scripts/verify-vps-integration \
              --archive "${directory}/integration.tar.gz" \
              --inventory "${directory}/inventory.json" \
              --expected-revision "${GITHUB_SHA}"
            ./scripts/build-application-release \
              --revision "${GITHUB_SHA}" \
              --expected-images "${directory}/expected-images.json" \
              --integration-reference \
                "${VPS_INTEGRATION_REPOSITORY}@sha256:$(printf 'f%.0s' {1..64})" \
              --migrations "${directory}/migrations.json" \
              --probes "${directory}/probes.json" \
              --output "${directory}/application-release.json"
            ./scripts/verify-application-release \
              --release "${directory}/application-release.json" \
              --revision "${GITHUB_SHA}" \
              --expected-images "${directory}/expected-images.json" \
              --integration-reference \
                "${VPS_INTEGRATION_REPOSITORY}@sha256:$(printf 'f%.0s' {1..64})" \
              --migrations "${directory}/migrations.json" \
              --probes "${directory}/probes.json"
          done
          cmp "${RUNNER_TEMP}/first/integration.tar.gz" \
            "${RUNNER_TEMP}/second/integration.tar.gz"
          cmp "${RUNNER_TEMP}/first/inventory.json" \
            "${RUNNER_TEMP}/second/inventory.json"
          cmp "${RUNNER_TEMP}/first/application-release.json" \
            "${RUNNER_TEMP}/second/application-release.json"

  publish:
    name: Publish immutable application release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run the producer contract tests
        run: ./scripts/verify-vps-release-contract

      - name: Wait for green checks on this exact push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          wait_for_workflow() {
            local workflow=$1
            local attempts=0
            while (( attempts < 180 )); do
              attempts=$((attempts + 1))
              runs=$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow}" \
                --commit "${GITHUB_SHA}" \
                --event push \
                --limit 20 \
                --json conclusion,databaseId,headSha,status)
              state=$(RUNS="${runs}" python3 -c '
          import json, os
          revision = os.environ["GITHUB_SHA"]
          runs = [item for item in json.loads(os.environ["RUNS"]) if item["headSha"] == revision]
          if not runs:
              print("missing")
          else:
              current = max(runs, key=lambda item: item["databaseId"])
              print("{}:{}".format(current["status"], current.get("conclusion") or ""))
              ')
              case "${state}" in
                completed:success) return 0 ;;
                completed:*) echo "${workflow} ended with ${state}" >&2; return 1 ;;
              esac
              sleep 10
            done
            echo "${workflow} did not finish within 30 minutes" >&2
            return 1
          }
          wait_for_workflow verify.yml
          wait_for_workflow images.yml

      - name: Refuse a stale main revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          canonical=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          test "${canonical}" = "${GITHUB_SHA}"

      - name: Configure Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the exact attested backend image
        id: images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/resolve-vps-images \
            --revision "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/component-images.json" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build and verify the deterministic integration package
        id: package
        env:
          COMPONENT_IMAGES: ${{ steps.images.outputs.component_images }}
        run: |
          package="${RUNNER_TEMP}/vps-integration-package"
          ./scripts/build-vps-integration \
            --revision "${GITHUB_SHA}" \
            --component-images "${COMPONENT_IMAGES}" \
            --output-directory "${package}" \
            --github-output "${GITHUB_OUTPUT}"
          ./scripts/verify-vps-integration \
            --archive "${package}/integration.tar.gz" \
            --inventory "${package}/inventory.json" \
            --expected-revision "${GITHUB_SHA}"

      - name: Push the immutable integration artifact
        id: integration
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CREATED: ${{ steps.package.outputs.created }}
        run: |
          set -Eeuo pipefail
          package=$(dirname -- "${ARCHIVE}")
          result=$(docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${package}:/workspace:ro" \
            --workdir /workspace \
            "${ORAS_IMAGE}" push \
            --artifact-type "${VPS_ARTIFACT_TYPE}" \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
            --format json \
            "${VPS_INTEGRATION_REPOSITORY}:sha-${GITHUB_SHA}" \
            "integration.tar.gz:${VPS_ARCHIVE_MEDIA_TYPE}" \
            "inventory.json:${VPS_INVENTORY_MEDIA_TYPE}")
          digest=$(RESULT="${result}" python3 -c '
          import json, os, re
          value = json.loads(os.environ["RESULT"]).get("digest")
          if not isinstance(value, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", value) is None:
              raise SystemExit("ORAS did not return an immutable integration digest")
          print(value)
          ')
          {
            echo "digest=${digest}"
            echo "reference=${VPS_INTEGRATION_REPOSITORY}@${digest}"
            echo "tag=${VPS_INTEGRATION_REPOSITORY}:sha-${GITHUB_SHA}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify the integration registry round trip
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ARCHIVE_DIGEST: ${{ steps.package.outputs.archive_digest }}
          CREATED: ${{ steps.package.outputs.created }}
          INVENTORY: ${{ steps.package.outputs.inventory }}
          INVENTORY_DIGEST: ${{ steps.package.outputs.inventory_digest }}
          MANIFEST_DIGEST: ${{ steps.integration.outputs.digest }}
          TAG: ${{ steps.integration.outputs.tag }}
        run: |
          remote="${RUNNER_TEMP}/remote-integration"
          mkdir -m 0700 "${remote}"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${remote}:/workspace" \
            --workdir /workspace \
            "${ORAS_IMAGE}" manifest fetch --output manifest.json "${TAG}"
          ./scripts/verify-vps-integration-manifest \
            --manifest "${remote}/manifest.json" \
            --expected-digest "${MANIFEST_DIGEST}" \
            --archive "${ARCHIVE}" \
            --inventory "${INVENTORY}" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-created "${CREATED}"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${remote}:/workspace" \
            --workdir /workspace \
            "${ORAS_IMAGE}" blob fetch --output integration.tar.gz \
            "${VPS_INTEGRATION_REPOSITORY}@${ARCHIVE_DIGEST}"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${remote}:/workspace" \
            --workdir /workspace \
            "${ORAS_IMAGE}" blob fetch --output inventory.json \
            "${VPS_INTEGRATION_REPOSITORY}@${INVENTORY_DIGEST}"
          cmp "${ARCHIVE}" "${remote}/integration.tar.gz"
          cmp "${INVENTORY}" "${remote}/inventory.json"
          ./scripts/verify-vps-integration \
            --archive "${remote}/integration.tar.gz" \
            --inventory "${remote}/inventory.json" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-created "${CREATED}"

      - name: Attest the integration artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.VPS_INTEGRATION_REPOSITORY }}
          subject-digest: ${{ steps.integration.outputs.digest }}
          push-to-registry: true

      - name: Verify integration provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE: ${{ steps.integration.outputs.reference }}
        run: |
          gh attestation verify "oci://${REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/vps-integration.yml" \
            --deny-self-hosted-runners

      - name: Refuse a stale release before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          canonical=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          test "${canonical}" = "${GITHUB_SHA}"

      - name: Build and verify the application release descriptor
        id: release
        env:
          EXPECTED_IMAGES: ${{ steps.package.outputs.expected_images }}
          INTEGRATION_REFERENCE: ${{ steps.integration.outputs.reference }}
          MIGRATIONS: ${{ steps.package.outputs.migrations }}
          PROBES: ${{ steps.package.outputs.probes }}
        run: |
          directory="${RUNNER_TEMP}/application-release-package"
          mkdir -m 0700 "${directory}"
          release="${directory}/application-release.json"
          ./scripts/build-application-release \
            --revision "${GITHUB_SHA}" \
            --expected-images "${EXPECTED_IMAGES}" \
            --integration-reference "${INTEGRATION_REFERENCE}" \
            --migrations "${MIGRATIONS}" \
            --probes "${PROBES}" \
            --output "${release}" \
            --github-output "${GITHUB_OUTPUT}"
          ./scripts/verify-application-release \
            --release "${release}" \
            --revision "${GITHUB_SHA}" \
            --expected-images "${EXPECTED_IMAGES}" \
            --integration-reference "${INTEGRATION_REFERENCE}" \
            --migrations "${MIGRATIONS}" \
            --probes "${PROBES}"

      - name: Push the immutable Atlas application release
        id: published_release
        env:
          CREATED: ${{ steps.package.outputs.created }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          directory=$(dirname -- "${RELEASE}")
          result=$(docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${directory}:/workspace:ro" \
            --workdir /workspace \
            "${ORAS_IMAGE}" push \
            --artifact-type "${APPLICATION_RELEASE_ARTIFACT_TYPE}" \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
            --format json \
            "${APPLICATION_RELEASE_REPOSITORY}:sha-${GITHUB_SHA}" \
            "application-release.json:${APPLICATION_RELEASE_LAYER_MEDIA_TYPE}")
          digest=$(RESULT="${result}" python3 -c '
          import json, os, re
          value = json.loads(os.environ["RESULT"]).get("digest")
          if not isinstance(value, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", value) is None:
              raise SystemExit("ORAS did not return an immutable release digest")
          print(value)
          ')
          {
            echo "digest=${digest}"
            echo "reference=${APPLICATION_RELEASE_REPOSITORY}@${digest}"
            echo "tag=${APPLICATION_RELEASE_REPOSITORY}:sha-${GITHUB_SHA}"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify the application release registry round trip
        env:
          CREATED: ${{ steps.package.outputs.created }}
          MANIFEST_DIGEST: ${{ steps.published_release.outputs.digest }}
          RELEASE: ${{ steps.release.outputs.release }}
          RELEASE_DIGEST: ${{ steps.release.outputs.release_digest }}
          TAG: ${{ steps.published_release.outputs.tag }}
        run: |
          remote="${RUNNER_TEMP}/remote-application-release"
          mkdir -m 0700 "${remote}"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${remote}:/workspace" \
            --workdir /workspace \
            "${ORAS_IMAGE}" manifest fetch --output manifest.json "${TAG}"
          ./scripts/verify-application-release-manifest \
            --manifest "${remote}/manifest.json" \
            --expected-digest "${MANIFEST_DIGEST}" \
            --release "${RELEASE}" \
            --revision "${GITHUB_SHA}" \
            --created "${CREATED}"
          docker run --rm \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            --volume "${remote}:/workspace" \
            --workdir /workspace \
            "${ORAS_IMAGE}" blob fetch --output application-release.json \
            "${APPLICATION_RELEASE_REPOSITORY}@${RELEASE_DIGEST}"
          cmp "${RELEASE}" "${remote}/application-release.json"
          ./scripts/verify-application-release \
            --release "${remote}/application-release.json" \
            --revision "${GITHUB_SHA}" \
            --expected-images "${{ steps.package.outputs.expected_images }}" \
            --integration-reference "${{ steps.integration.outputs.reference }}" \
            --migrations "${{ steps.package.outputs.migrations }}" \
            --probes "${{ steps.package.outputs.probes }}"

      - name: Attest the application release
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.APPLICATION_RELEASE_REPOSITORY }}
          subject-digest: ${{ steps.published_release.outputs.digest }}
          push-to-registry: true

      - name: Verify application release provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFERENCE: ${{ steps.published_release.outputs.reference }}
        run: |
          gh attestation verify "oci://${REFERENCE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --signer-workflow \
              "${GITHUB_REPOSITORY}/.github/workflows/vps-integration.yml" \
            --deny-self-hosted-runners

      - name: Recheck canonical main after publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          canonical=$(gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          test "${canonical}" = "${GITHUB_SHA}"

      - name: Write release evidence
        env:
          APPLICATION_RELEASE: ${{ steps.published_release.outputs.reference }}
          COMPONENT_IMAGES: ${{ steps.images.outputs.component_images }}
          INTEGRATION_RELEASE: ${{ steps.integration.outputs.reference }}
        run: |
          evidence="${RUNNER_TEMP}/release-evidence"
          mkdir -m 0700 "${evidence}"
          EVIDENCE="${evidence}/release.json" python3 -c '
          import json, os
          with open(os.environ["COMPONENT_IMAGES"], encoding="ascii") as source:
              components = json.load(source)
          value = {
              "application_release": os.environ["APPLICATION_RELEASE"],
              "components": components,
              "contract": "monflorian.release-evidence",
              "integration_release": os.environ["INTEGRATION_RELEASE"],
              "revision": os.environ["GITHUB_SHA"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "schema": 1,
          }
          with open(os.environ["EVIDENCE"], "w", encoding="ascii") as output:
              json.dump(value, output, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
              output.write("\n")
          '

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monflorian-application-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evidence/release.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Report the immutable Atlas signal
        env:
          APPLICATION_RELEASE: ${{ steps.published_release.outputs.reference }}
          INTEGRATION_RELEASE: ${{ steps.integration.outputs.reference }}
        run: |
          {
            echo '### Published immutable application release'
            echo
            echo "Source revision: \`${GITHUB_SHA}\`"
            echo "Atlas signal: \`${APPLICATION_RELEASE}\`"
            echo "Integration bundle: \`${INTEGRATION_RELEASE}\`"
            echo
            echo 'Publication does not activate a VPS deployment.'
          } >>"${GITHUB_STEP_SUMMARY}"

name: monflorian

services:
  backend:
    image: ${MONFLORIAN_BACKEND_IMAGE:?MONFLORIAN_BACKEND_IMAGE must be an immutable digest reference}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      BOOKING_MODE: external
      HOST: 0.0.0.0
      MONFLORIAN_ACCESS_MODE: public
      MONFLORIAN_GENERATION_ENABLED: "false"
      MONFLORIAN_ILLUSTRATION_ENABLED: "false"
      MONFLORIAN_PUBLIC_ORIGIN: https://monflorian.com
      MONFLORIAN_RELEASE: ${MONFLORIAN_BACKEND_IMAGE:?MONFLORIAN_BACKEND_IMAGE must be an immutable digest reference}
      MONFLORIAN_TRUST_PROXY: "true"
      NODE_ENV: production
      OPENAI_API_KEY_FILE: /run/secrets/monflorian_openai_api_key
      PORT: "8080"
    secrets:
      - source: monflorian_openai_api_key
        target: monflorian_openai_api_key
    networks:
      app_monflorian:
        aliases:
          - monflorian-backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/api/health')
          .then(response => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    logging:
      driver: local
      options:
        max-file: "3"
        max-size: 10m

networks:
  app_monflorian:
    external: true
    name: app_monflorian

secrets:
  monflorian_openai_api_key:
    name: monflorian_openai_api_key
    file: /etc/vps/secrets/monflorian/monflorian-openai-api-key

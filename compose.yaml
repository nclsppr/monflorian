name: monflorian

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "127.0.0.1:${MONFLORIAN_PORT:-8080}:8080"
    environment:
      BOOKING_MODE: external
      MONFLORIAN_ACCESS_MODE: private
      MONFLORIAN_GENERATION_ENABLED: "false"
      MONFLORIAN_ILLUSTRATION_ENABLED: "false"
      MONFLORIAN_PUBLIC_ORIGIN: "http://127.0.0.1:${MONFLORIAN_PORT:-8080}"
      MONFLORIAN_RELEASE: local-compose
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/api/health').then(r=>r.json()).then(v=>process.exit(v.status==='ok'?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    stop_grace_period: 5s
